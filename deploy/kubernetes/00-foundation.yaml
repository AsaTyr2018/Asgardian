apiVersion: v1
kind: Namespace
metadata:
  name: asgardian
  labels:
    app.kubernetes.io/name: asgardian
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui-engine
  namespace: asgardian
spec:
  ports: [{ name: comfyui, port: 8188, protocol: TCP, targetPort: 8188 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: comfyui-engine-static
  namespace: asgardian
  labels:
    kubernetes.io/service-name: comfyui-engine
addressType: IPv4
ports: [{ name: comfyui, protocol: TCP, port: 8188 }]
endpoints:
  - addresses: ["203.0.113.10"]
    conditions: { ready: true }
---
apiVersion: v1
kind: Service
metadata:
  name: asgardian-postgres
  namespace: asgardian
spec:
  selector: { app.kubernetes.io/component: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: asgardian-postgres
  namespace: asgardian
spec:
  serviceName: asgardian-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: postgres }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asgardian
        app.kubernetes.io/component: postgres
    spec:
      nodeSelector:
        asgardian.io/runtime: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: asgardian }
            - { name: POSTGRES_USER, value: asgardian }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: asgardian-runtime, key: postgres-password } }
          readinessProbe: { exec: { command: ["pg_isready", "-U", "asgardian"] }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: asgardian-redis
  namespace: asgardian
spec:
  selector: { app.kubernetes.io/component: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: asgardian-redis
  namespace: asgardian
spec:
  serviceName: asgardian-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: asgardian, app.kubernetes.io/component: redis }
    spec:
      nodeSelector: { asgardian.io/runtime: "true" }
      securityContext: { runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:8.2-alpine
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 200m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources: { requests: { storage: 1Gi } }
