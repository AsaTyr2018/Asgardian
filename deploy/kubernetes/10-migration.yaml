apiVersion: batch/v1
kind: Job
metadata:
  name: asgardian-migrate-0-4-0
  namespace: asgardian
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asgardian
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: asgardian-registry
      nodeSelector:
        asgardian.io/runtime: "true"
      containers:
        - name: migrate
          image: ghcr.io/example/asgardian-backend:0.4.0-arm64
          imagePullPolicy: IfNotPresent
          command: ["asgardian-migrate"]
          envFrom: [{ secretRef: { name: asgardian-runtime } }]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
