apiVersion: v1
kind: Service
metadata:
  name: asgardian-api
  namespace: asgardian
spec:
  selector: { app.kubernetes.io/component: api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asgardian-api
  namespace: asgardian
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: asgardian, app.kubernetes.io/component: api }
    spec:
      nodeSelector: { asgardian.io/runtime: "true" }
      imagePullSecrets:
        - name: asgardian-registry
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/example/asgardian-backend:0.4.2-arm64
          imagePullPolicy: IfNotPresent
          command: ["asgardian-api"]
          env: [{ name: ASGARDIAN_REDIS_URL, value: "redis://asgardian-redis:6379/0" }]
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ secretRef: { name: asgardian-runtime } }]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: asgardian.example.local }]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: asgardian.example.local }]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 75m, memory: 128Mi }
            limits: { cpu: 400m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asgardian-worker
  namespace: asgardian
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: asgardian, app.kubernetes.io/component: worker }
    spec:
      nodeSelector: { asgardian.io/runtime: "true" }
      imagePullSecrets:
        - name: asgardian-registry
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/example/asgardian-backend:0.4.2-arm64
          imagePullPolicy: IfNotPresent
          command: ["asgardian-worker"]
          env: [{ name: ASGARDIAN_REDIS_URL, value: "redis://asgardian-redis:6379/0" }]
          envFrom: [{ secretRef: { name: asgardian-runtime } }]
          resources:
            requests: { cpu: 75m, memory: 192Mi }
            limits: { cpu: 600m, memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asgardian-reconciler
  namespace: asgardian
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/component: reconciler }
  template:
    metadata:
      labels: { app.kubernetes.io/name: asgardian, app.kubernetes.io/component: reconciler }
    spec:
      nodeSelector: { asgardian.io/runtime: "true" }
      imagePullSecrets:
        - name: asgardian-registry
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: reconciler
          image: ghcr.io/example/asgardian-backend:0.4.2-arm64
          imagePullPolicy: IfNotPresent
          command: ["asgardian-reconciler"]
          env: [{ name: ASGARDIAN_REDIS_URL, value: "redis://asgardian-redis:6379/0" }]
          envFrom: [{ secretRef: { name: asgardian-runtime } }]
          resources:
            requests: { cpu: 75m, memory: 192Mi }
            limits: { cpu: 600m, memory: 768Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: asgardian-web
  namespace: asgardian
spec:
  selector: { app.kubernetes.io/component: web }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asgardian-web
  namespace: asgardian
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: asgardian, app.kubernetes.io/component: web }
    spec:
      nodeSelector: { asgardian.io/runtime: "true" }
      imagePullSecrets:
        - name: asgardian-registry
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/example/asgardian-web:0.4.2-arm64
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 150m, memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: nginx-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asgardian
  namespace: asgardian
spec:
  ingressClassName: traefik
  rules:
    - host: asgardian.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: asgardian-web, port: { name: http } } }