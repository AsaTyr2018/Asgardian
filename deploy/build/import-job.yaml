apiVersion: batch/v1
kind: Job
metadata:
  name: asgardian-import-0-4-2
  namespace: asgardian
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asgardian
        app.kubernetes.io/component: image-import
    spec:
      restartPolicy: Never
      nodeSelector:
        asgardian.io/build: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: import
          image: rancher/k3s:v1.34.5-k3s1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ln -s /bin/k3s /tmp/ctr
              /tmp/ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io images import /workspace/out/backend.tar
              /tmp/ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io images import /workspace/out/web.tar
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: workspace, mountPath: /workspace, readOnly: true }
            - { name: containerd, mountPath: /run/k3s/containerd/containerd.sock }
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: asgardian-build-workspace
        - name: containerd
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
