apiVersion: batch/v1
kind: Job
metadata:
  name: asgardian-build-0-4-2
  namespace: asgardian
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asgardian
        app.kubernetes.io/component: build
      annotations:
        container.apparmor.security.beta.kubernetes.io/buildkit: unconfined
    spec:
      restartPolicy: Never
      nodeSelector:
        asgardian.io/build: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      initContainers:
        - name: unpack-source
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - |
              rm -rf /workspace/source /workspace/out
              mkdir -p /workspace/source /workspace/out
              tar -xzf /bundle/source.tgz -C /workspace/source
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 96Mi }
          volumeMounts:
            - { name: source, mountPath: /bundle, readOnly: true }
            - { name: workspace, mountPath: /workspace }
      containers:
        - name: buildkit
          image: moby/buildkit:v0.31.1-rootless
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-lc"]
          args:
            - |
              buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=/workspace/source \
                --local dockerfile=/workspace/source \
                --opt filename=Dockerfile.backend \
                --opt platform=linux/arm64 \
                --output type=docker,name=asgardian-backend:0.4.2-arm64,dest=/workspace/out/backend.tar
              buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=/workspace/source \
                --local dockerfile=/workspace/source \
                --opt filename=Dockerfile.web \
                --opt platform=linux/arm64 \
                --output type=docker,name=asgardian-web:0.4.2-arm64,dest=/workspace/out/web.tar
          env:
            - name: BUILDKITD_FLAGS
              value: --oci-worker-no-process-sandbox
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add: ["SETUID", "SETGID"]
              drop: ["ALL"]
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: buildkit-state, mountPath: /home/user/.local/share/buildkit }
      volumes:
        - name: source
          configMap:
            name: asgardian-source
        - name: workspace
          persistentVolumeClaim:
            claimName: asgardian-build-workspace
        - name: buildkit-state
          emptyDir:
            sizeLimit: 4Gi
