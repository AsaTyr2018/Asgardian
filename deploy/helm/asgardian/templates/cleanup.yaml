{{- if .Values.cleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: asgardian-transient-cleanup
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cleanup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cleanup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cleanup
            {{- include "asgardian.labels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- include "asgardian.workerAffinity" . | nindent 10 }}
          {{- include "asgardian.imagePullSecrets" . | nindent 10 }}
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: cleanup
              image: "{{ .Values.backendImage.repository }}:{{ .Values.backendImage.tag }}"
              imagePullPolicy: {{ .Values.backendImage.pullPolicy }}
              command: ["asgardian-cleanup"]
              env:
                {{- include "asgardian.env" . | nindent 16 }}
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 150m, memory: 192Mi }
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
{{- end }}
