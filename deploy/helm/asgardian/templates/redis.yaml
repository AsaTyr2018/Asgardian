apiVersion: v1
kind: Service
metadata:
  name: asgardian-redis
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: asgardian-redis
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  serviceName: asgardian-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        {{- include "asgardian.labels" . | nindent 8 }}
    spec:
      {{- include "asgardian.workerAffinity" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", {{ .Values.redis.maxMemory | quote }}, "--maxmemory-policy", "noeviction"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 10, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.redis.storageClass | quote }}
        resources: { requests: { storage: {{ .Values.redis.storage | quote }} } }
