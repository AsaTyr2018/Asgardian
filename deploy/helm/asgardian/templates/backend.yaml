apiVersion: v1
kind: Service
metadata:
  name: asgardian-api
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asgardian-api
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: api }
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        {{- include "asgardian.labels" . | nindent 8 }}
    spec:
      {{- include "asgardian.workerAffinity" . | nindent 6 }}
      {{- include "asgardian.imagePullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: "{{ .Values.backendImage.repository }}:{{ .Values.backendImage.tag }}"
          imagePullPolicy: {{ .Values.backendImage.pullPolicy }}
          command: ["asgardian-api"]
          ports: [{ name: http, containerPort: 8000 }]
          env:
            {{- include "asgardian.env" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: {{ .Values.ingress.host | quote }} }]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: {{ .Values.ingress.host | quote }} }]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asgardian-worker
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/component: worker }
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        {{- include "asgardian.labels" . | nindent 8 }}
    spec:
      {{- include "asgardian.workerAffinity" . | nindent 6 }}
      {{- include "asgardian.imagePullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: "{{ .Values.backendImage.repository }}:{{ .Values.backendImage.tag }}"
          imagePullPolicy: {{ .Values.backendImage.pullPolicy }}
          command: ["asgardian-worker"]
          env:
            {{- include "asgardian.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asgardian-reconciler
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/component: reconciler }
  template:
    metadata:
      labels:
        app.kubernetes.io/component: reconciler
        {{- include "asgardian.labels" . | nindent 8 }}
    spec:
      {{- include "asgardian.workerAffinity" . | nindent 6 }}
      {{- include "asgardian.imagePullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: reconciler
          image: "{{ .Values.backendImage.repository }}:{{ .Values.backendImage.tag }}"
          imagePullPolicy: {{ .Values.backendImage.pullPolicy }}
          command: ["asgardian-reconciler"]
          env:
            {{- include "asgardian.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.reconciler | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
