apiVersion: v1
kind: Service
metadata:
  name: asgardian-postgres
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: asgardian-postgres
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  serviceName: asgardian-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: postgres }
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        {{- include "asgardian.labels" . | nindent 8 }}
    spec:
      {{- include "asgardian.workerAffinity" . | nindent 6 }}
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: asgardian-runtime, key: postgres-password } }
          readinessProbe: { exec: { command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}] }, initialDelaySeconds: 5, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
