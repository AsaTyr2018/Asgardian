apiVersion: v1
kind: Service
metadata:
  name: asgardian-web
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: web }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asgardian-web
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: web }
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        {{- include "asgardian.labels" . | nindent 8 }}
    spec:
      {{- include "asgardian.workerAffinity" . | nindent 6 }}
      {{- include "asgardian.imagePullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asgardian
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: asgardian-web, port: { name: http } } }
{{- end }}
