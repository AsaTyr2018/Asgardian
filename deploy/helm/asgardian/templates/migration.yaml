apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-migrate-{{ .Release.Revision }}"
  labels:
    {{- include "asgardian.labels" . | nindent 4 }}
  annotations:
    # On upgrades the additive schema must exist before the new API and worker
    # start. On first install PostgreSQL is only available after normal
    # resources have been created.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
        {{- include "asgardian.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "asgardian.workerAffinity" . | nindent 6 }}
      {{- include "asgardian.imagePullSecrets" . | nindent 6 }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: "{{ .Values.backendImage.repository }}:{{ .Values.backendImage.tag }}"
          imagePullPolicy: {{ .Values.backendImage.pullPolicy }}
          command: ["asgardian-migrate"]
          env:
            {{- include "asgardian.env" . | nindent 12 }}
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, readOnlyRootFilesystem: true }
