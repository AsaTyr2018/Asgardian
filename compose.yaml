services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: asgardian
      POSTGRES_USER: asgardian
      POSTGRES_PASSWORD: asgardian
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asgardian"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["asgardian-api"]
    env_file: .env
    environment:
      ASGARDIAN_DATABASE_URL: postgresql+psycopg://asgardian:asgardian@postgres:5432/asgardian
      ASGARDIAN_REDIS_URL: redis://redis:6379/0
      ASGARDIAN_ALLOWED_HOSTS: localhost,127.0.0.1,asgardian.local
      ASGARDIAN_ALLOWED_ORIGINS: http://localhost:8080,http://asgardian.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["asgardian-worker"]
    env_file: .env
    environment:
      ASGARDIAN_DATABASE_URL: postgresql+psycopg://asgardian:asgardian@postgres:5432/asgardian
      ASGARDIAN_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reconciler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["asgardian-reconciler"]
    env_file: .env
    environment:
      ASGARDIAN_DATABASE_URL: postgresql+psycopg://asgardian:asgardian@postgres:5432/asgardian
      ASGARDIAN_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
